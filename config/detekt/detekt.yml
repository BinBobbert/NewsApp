naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true

style:
  FunctionOnlyReturningConstant:
    ignoreAnnotated: ['Provides']
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/theme/Color.kt']
  UnusedImports:
    active: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']

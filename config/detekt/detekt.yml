naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true

style:
  FunctionOnlyReturningConstant:
    ignoreAnnotated: ['Provides']
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/theme/Color.kt']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
